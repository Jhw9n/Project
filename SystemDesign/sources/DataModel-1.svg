<text x="45" y="942" font-family="NanumSquareRound, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="400" fill="#172C39" text-anchor="start">* persistentModelID는 SwiftData가 관리하는 식별자이며, 직접 선언한 UUID 필드가 아니다.</text>
<text x="45" y="967" font-family="NanumSquareRound, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="400" fill="#172C39" text-anchor="start">점선 관계는 앱의 ID 필터 조회를 나타낸다. @Relationship 및 강제 외래키 관계로 구현되어 있지 않다.</text>
<text x="45" y="992" font-family="NanumSquareRound, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="400" fill="#172C39" text-anchor="start">식단은 저장 시점의 음식명·분량·영양값을 보존한다. 카탈로그 변경으로 과거 기록을 다시 계산하지 않는다.</text>
